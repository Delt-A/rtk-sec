replace = [
  { pattern = "(?m)^.*\\r", replacement = "" },
]
keep_lines_matching = [
  "\\(Status: \\d+\\)",
  "^Found: ",
  "^\\[\\+\\] (Url|Domain|Method|Wordlist):",
  "^\\[ERROR\\]",
