# --- sslscan.toml ---
[filters.sslscan]
description = "Drop rejected ciphers, keep accepted/preferred and vulnerability checks"
match_command = "^sslscan\\b"
strip_ansi = true
filter_stderr = true
# A typical run lists 200-400 "Rejected" ciphers against a dozen that matter.
strip_lines_matching = [
  "^\\s*$",
  "^Rejected\\s+",
  "^\\s*Version: ",
  "^\\s*OpenSSL ",
  "^\\s+_+$",
]
max_lines = 120
truncate_lines_at = 160

