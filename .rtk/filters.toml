# --- john.toml ---
[filters.john]
description = "Drop john boilerplate and status lines, keep cracked passwords"
match_command = "^john\\b"
strip_ansi = true
filter_stderr = true
replace = [
  { pattern = "(?m)^.*\\r", replacement = "" },
]
# Cracked lines are "password  (user)" with no fixed prefix, so there is nothing
# rigid to keep on — only the noise has a stable shape.
strip_lines_matching = [
  "^\\s*$",
  "^Using default input encoding:",
  "^Will run \\d+ OpenMP threads",
  "^Press 'q' or Ctrl-C to abort",
  "^Warning: detected hash type",
  "^Warning: only loading hashes",
  "^Almost done: Processing the remaining",
  "^Proceeding with",
  "^Use the \"--show",
  "\\d+g/s .*p/s .*c/s .*C/s",
  "^Session (completed|aborted|stopped)",
]
max_lines = 100
truncate_lines_at = 200

[[tests.john]]
name = "keeps cracked password and hash-type line, drops status"
input = """
Using default input encoding: UTF-8
Loaded 1 password hash (md5crypt, crypt(3) $1$ (and variants) [MD5 128/128 AVX 4x3])
Will run 8 OpenMP threads
Press 'q' or Ctrl-C to abort, almost any other key for status
password123      (alice)
1g 0:00:00:03 DONE (2026-08-16 10:00) 0.3115g/s 12345p/s 12345c/s 12345C/s
Use the "--show" option to display all of the cracked passwords reliably
Session completed.
"""
expected = "Loaded 1 password hash (md5crypt, crypt(3) $1$ (and variants) [MD5 128/128 AVX 4x3])\npassword123      (alice)"

[[tests.john]]
name = "no-hashes-loaded error is not swallowed"
input = "Using default input encoding: UTF-8\nNo password hashes loaded (see FAQ)"
expected = "No password hashes loaded (see FAQ)"

# --- netexec.toml ---
[filters.netexec]
description = "Keep netexec/crackmapexec status lines, cap failure spam"
match_command = "^(netexec|nxc|crackmapexec|cme)\\s+(smb|ssh|ldap|winrm|mssql|rdp|vnc|ftp|nfs|wmi)\\b"
strip_ansi = true
filter_stderr = true
keep_lines_matching = [
  "\\[\\+\\]",
  "\\[-\\]",
  "\\[\\*\\]",
  "\\(Pwn3d!\\)",
  "(?i)^error",
  "(?i)connection refused",
  "(?i)traceback",
]
# A /24 spray emits 254 [-] lines and the DSL cannot count them; the wrapper
# profile in bin/rtk-sec collapses those into a single tally.
max_lines = 80
truncate_lines_at = 200
on_empty = "netexec: no status lines matched the filter (see full output)"

[[tests.netexec]]
name = "keeps host info, failure and Pwn3d"
input = """
SMB         10.10.10.10     445    DC01             [*] Windows Server 2019 Build 17763 x64 (name:DC01) (domain:corp.local) (signing:True) (SMBv1:False)
SMB         10.10.10.10     445    DC01             [-] corp.local\\alice:Summer2024 STATUS_LOGON_FAILURE
SMB         10.10.10.10     445    DC01             [+] corp.local\\admin:Password1 (Pwn3d!)
"""
expected = "SMB         10.10.10.10     445    DC01             [*] Windows Server 2019 Build 17763 x64 (name:DC01) (domain:corp.local) (signing:True) (SMBv1:False)\nSMB         10.10.10.10     445    DC01             [-] corp.local\\alice:Summer2024 STATUS_LOGON_FAILURE\nSMB         10.10.10.10     445    DC01             [+] corp.local\\admin:Password1 (Pwn3d!)"

[[tests.netexec]]
name = "python traceback is not swallowed"
input = "Traceback (most recent call last):\n  File \"/usr/bin/netexec\", line 8, in <module>\nConnectionRefusedError: [Errno 111] Connection refused"
expected = "Traceback (most recent call last):\nConnectionRefusedError: [Errno 111] Connection refused"

# --- smbclient.toml ---
[filters.smbclient]
description = "Drop smbclient's constant cosmetic warning banner; keep every listing, error, and NT_STATUS line untouched"
match_command = "^smbclient\\b"
strip_ansi = true
filter_stderr = true
strip_lines_matching = [
  "^WARNING: no network interfaces found$",
]
max_lines = 300
on_empty = "smbclient: nothing survived the filter (see full output)"

[[tests.smbclient]]
name = "recurse listing: warning dropped, every file/dir line kept"
input = """
WARNING: no network interfaces found
  Public                              D       60  Thu Oct 15 16:36:13 2026
  Secret                              D       60  Thu Oct 15 16:36:13 2026

\\Public
  readme.txt                         AN       20  Thu Oct 15 16:36:13 2026

\\Secret
  passwords.txt                      AN        8  Thu Oct 15 16:36:13 2026

\t\t148529400 blocks of size 1024. 14851044 blocks available
"""
