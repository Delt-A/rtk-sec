# --- tshark.toml ---
[filters.tshark]
description = "Drop the live-capture startup banner; every packet line and the packet count are data, not noise"
match_command = "^tshark\\b"
strip_ansi = true
filter_stderr = true
# `-r <file>` (reading a capture — the common post-hoc analysis mode) prints
# no boilerplate at all; every line is a packet, a field, or an error, so
# this filter is a deliberate no-op there. The only genuine boilerplate is
# the live-capture (`-i`) startup banner. "N packets captured" is kept on
# purpose: in `-w file.pcap` mode it is the *only* stdout line, and 0 vs N is
# itself the finding (did the filter/interface/permissions actually work).
strip_lines_matching = [
  "^Capturing on '.*'$",
]
max_lines = 500
on_empty = "tshark: nothing survived the filter (see full output)"

[[tests.tshark]]
name = "live capture to file: banner dropped, packet count kept"
input = "Capturing on 'Loopback: lo'\n2 packets captured"
expected = "2 packets captured"

[[tests.tshark]]
name = "live capture to stdout: banner dropped, every packet summary line kept"
input = """
Capturing on 'Loopback: lo'
3 packets captured
    1 0.000000000    127.0.0.1 → 127.0.0.1    TCP 74 39706 → 8080 [SYN] Seq=0 Win=65495 Len=0
    2 0.000016331    127.0.0.1 → 127.0.0.1    TCP 74 8080 → 39706 [SYN, ACK] Seq=0 Ack=1 Win=65483
"""
expected = "3 packets captured\n    1 0.000000000    127.0.0.1 → 127.0.0.1    TCP 74 39706 → 8080 [SYN] Seq=0 Win=65495 Len=0\n    2 0.000016331    127.0.0.1 → 127.0.0.1    TCP 74 8080 → 39706 [SYN, ACK] Seq=0 Ack=1 Win=65483"

[[tests.tshark]]
name = "-r mode (reading a file): no banner exists, output passes through untouched"
input = "    1 0.000000000    127.0.0.1 → 127.0.0.1    HTTP 144 GET / HTTP/1.1 \n    2 0.010793832    127.0.0.1 → 127.0.0.1    TCP 1623 HTTP/1.1 200 OK "
expected = "    1 0.000000000    127.0.0.1 → 127.0.0.1    HTTP 144 GET / HTTP/1.1 \n    2 0.010793832    127.0.0.1 → 127.0.0.1    TCP 1623 HTTP/1.1 200 OK "

[[tests.tshark]]
name = "bad interface error is not swallowed"
input = "Capturing on 'nonexistent999'\ntshark: There is no device named \"nonexistent999\".\n(No such device exists)\n0 packets captured"
expected = "tshark: There is no device named \"nonexistent999\".\n(No such device exists)\n0 packets captured"

[[tests.tshark]]
name = "invalid capture filter error is not swallowed"
input = "Capturing on 'Loopback: lo'\ntshark: Invalid capture filter \"garbage(((\" for interface 'Loopback'.\n\nThat string isn't a valid capture filter (can't parse filter expression: syntax error).\n0 packets captured"
expected = "tshark: Invalid capture filter \"garbage(((\" for interface 'Loopback'.\n\nThat string isn't a valid capture filter (can't parse filter expression: syntax error).\n0 packets captured"

# --- feroxbuster.toml ---
[filters.feroxbuster]
description = "Keep feroxbuster result rows, drop box-drawing banner and progress bars"
match_command = "^feroxbuster\\b.*\\s-(-url|u)\\s"
strip_ansi = true
filter_stderr = true
replace = [
  { pattern = "(?m)^.*\\r", replacement = "" },
]
keep_lines_matching = [
  "^\\s*\\d{3}\\s+[A-Z]{3,7}\\s+\\d+l\\s+\\d+w\\s+\\d+c\\s",
  "^\\[!\\]",
  "^ERROR",
  "(?i)^error",
  "(?i)connection refused",
  "(?i)could not connect",
  "(?i)wordlist.*(not found|could not)",
]
max_lines = 150
truncate_lines_at = 200
on_empty = "feroxbuster: no result rows matched the filter (see full output)"

[[tests.feroxbuster]]
name = "keeps result rows, drops banner block and blank lines"
input = """
 ___  ___  __   __     __      __         __   ___
by Ben "epi" Risher                      ver: 2.13.1
 Target Url            | http://127.0.0.1:8080/
 Threads               | 50
 Press [ENTER] to use the Scan Management Menu

404      GET       13l       32w      335c Auto-filtering found 404-like response and created new filter; toggle off with --dont-filter

200      GET        1l        2w       58c http://127.0.0.1:8080/

301      GET        0l        0w        0c http://127.0.0.1:8080/admin => http://127.0.0.1:8080/admin/
"""
expected = "404      GET       13l       32w      335c Auto-filtering found 404-like response and created new filter; toggle off with --dont-filter\n200      GET        1l        2w       58c http://127.0.0.1:8080/\n301      GET        0l        0w        0c http://127.0.0.1:8080/admin => http://127.0.0.1:8080/admin/"

[[tests.feroxbuster]]
name = "connection error is not swallowed"
input = " ___  ___  __   __\nby Ben \"epi\" Risher                      ver: 2.13.1\n\nERROR feroxbuster::heuristics could not connect to http://127.0.0.1:9999, skipping...\n"
expected = "ERROR feroxbuster::heuristics could not connect to http://127.0.0.1:9999, skipping..."

[[tests.feroxbuster]]
name = "indicatif progress bar is collapsed away"
input = "200      GET        1l        2w       58c http://127.0.0.1:8080/\n[####>---------------] - 1s     2000/4614  1s      found:2       errors:0\r[####################] - 2s     4614/4614  0s      found:9       errors:0"
expected = "200      GET        1l        2w       58c http://127.0.0.1:8080/"

# --- ffuf.toml ---
[filters.ffuf]
description = "Keep ffuf hits and the final progress summary, drop banner and repaints"
match_command = "^ffuf\\b.*\\s-u\\s"
strip_ansi = true
filter_stderr = true
# ffuf packs many CR-repaints onto one physical line and puts the finding after
# the last CR, so collapsing to the final repaint keeps the hit, not the progress.
replace = [
  { pattern = "(?m)^.*\\r", replacement = "" },
]
keep_lines_matching = [
  "\\[Status: \\d+, Size: \\d+",
  "^:: Progress: ",
  "^\\s+:: (Method|URL|Wordlist|Matcher|Filter)\\s+:",
  "^\\[ERR\\]",
  "^\\[WARN\\]",
  "(?i)^error",
  "(?i)connection refused",
  "(?i)encountered .* error",
]
max_lines = 120
truncate_lines_at = 200
on_empty = "ffuf: no hits matched the filter (see full output)"

[[tests.ffuf]]
name = "collapses CR repaints to the finding, drops ascii banner"
input = "\n        /'___\\  /'___\\           /'___\\       \n       v2.1.0-dev\n________________________________________________\n\n :: Method           : GET\n :: URL              : http://127.0.0.1:8080/FUZZ\n :: Threads          : 40\n________________________________________________\n\n\r:: Progress: [5/4614] :: Job [1/1] :: 0 req/sec :: Duration: [0:00:00] :: Errors: 0 ::\radmin                   [Status: 301, Size: 0, Words: 1, Lines: 1, Duration: 2ms]\n"
expected = " :: Method           : GET\n :: URL              : http://127.0.0.1:8080/FUZZ\nadmin                   [Status: 301, Size: 0, Words: 1, Lines: 1, Duration: 2ms]"

[[tests.ffuf]]
name = "trailing progress-only line survives as the run summary"
input = "\r:: Progress: [4202/4614] :: Job [1/1] :: 2409 req/sec :: Duration: [0:00:01] :: Errors: 0 ::\r:: Progress: [4614/4614] :: Job [1/1] :: 2500 req/sec :: Duration: [0:00:02] :: Errors: 0 ::"
expected = ":: Progress: [4614/4614] :: Job [1/1] :: 2500 req/sec :: Duration: [0:00:02] :: Errors: 0 ::"

[[tests.ffuf]]
name = "connection error is not swallowed"
input = "\n       v2.1.0-dev\n________________________________________________\n\n[ERR] Get \"http://127.0.0.1:9999/x\": dial tcp 127.0.0.1:9999: connect: connection refused"
expected = "[ERR] Get \"http://127.0.0.1:9999/x\": dial tcp 127.0.0.1:9999: connect: connection refused"

# --- gobuster.toml ---
[filters.gobuster]
description = "Keep gobuster findings and target config, drop banner and progress"
match_command = "^gobuster\\s+(dir|dns|vhost|fuzz|s3|gcs|tftp)\\b"
