# --- nikto.toml ---
[filters.nikto]
description = "Compact nikto output: drop rules/timestamps/prompts, strip reference URLs"
match_command = "^nikto\\b"
strip_ansi = true
filter_stderr = true
# The "See: <url>" tail on nearly every finding is the single biggest token sink
# and carries no information the finding text does not already state.
replace = [
  { pattern = " See: https?://\\S+", replacement = "" },
]
strip_lines_matching = [
  "^\\s*$",
  "^-{10,}$",
  "^- Nikto v",
  "^\\+ (Start|End) Time:",
  "^\\+ Target Hostname:",
  "^\\+ Platform:",
  "^\\+ \\d+ host\\(s\\) tested",
  "^\\+ No CGI Directories found",
  "^\\s+\\*{10,}$",
  "^\\s+Portions of the server's headers",
  "^\\s+the Nikto .* database or are newer",
  "^\\s+to submit this information",
  "^\\s+for a Nikto update",
]
max_lines = 150
truncate_lines_at = 220
on_empty = "nikto: nothing survived the filter (see full output)"

[[tests.nikto]]
name = "keeps findings, drops rules/timestamps, strips See: URLs"
input = """
