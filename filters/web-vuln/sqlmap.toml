[filters.sqlmap]
description = "Keep sqlmap injection points and verdicts, drop banner/timestamps/probe chatter"
match_command = "^sqlmap\\b.*\\s(-u|-r|--url|-m|-g)\\b"
strip_ansi = true
filter_stderr = true
# sqlmap prefixes machinery with "[hh:mm:ss] [LEVEL]" and prints results
# (Parameter/Type/Title/Payload, DBMS verdicts, table dumps) with no prefix at
# all — so only named INFO/WARNING noise is stripped, never a bare line.
replace = [
  { pattern = "(?m)^\\[\\d\\d:\\d\\d:\\d\\d\\] ", replacement = "" },
  { pattern = " Do you want to keep testing the others \\(if any\\)\\? \\[y/N\\] [YyNn]", replacement = "" },
]
strip_lines_matching = [
  "^\\s*$",
  "^\\s*_{3,}\\s*$",
  "^\\s*__H__\\s*$",
  "^ ___ ___\\[",
  "^\\|",
  "^\\s+\\|_\\|V",
  "^\\[!\\] legal disclaimer:",
  "^\\[\\*\\] (starting|ending) @",
  "^\\[\\d+/\\d+\\] URL:",
  "^do you want to ",
  "^for the remaining tests, do you want",
  "^it looks like the back-end DBMS is .*Do you want",
  "^> [YyNn]$",
  "\\[INFO\\] testing ",
  "\\[INFO\\] using '.*' as the CSV",
  "\\[INFO\\] checking if the target is protected",
  "\\[INFO\\] target URL content is stable",
  "\\[INFO\\] automatically extending",
  "\\[INFO\\] 'ORDER BY' technique",
  "\\[INFO\\] target URL appears to have \\d+ column",
  "\\[INFO\\] you can find results",
  "\\[WARNING\\] turning off pre-connect",
  "\\[WARNING\\] reflective value",
]
max_lines = 150
# The UNION payload is the artifact; truncating it mid-CHAR() destroys it.
truncate_lines_at = 400
on_empty = "sqlmap: nothing survived the filter (see full output)"

[[tests.sqlmap]]
name = "keeps the injection point block verbatim, drops probe chatter"
input = """
[18:41:34] [INFO] testing 'AND boolean-based blind - WHERE or HAVING clause'
[18:41:34] [INFO] GET parameter 'id' appears to be 'AND boolean-based blind - WHERE or HAVING clause' injectable (with --string="alice")
[18:41:38] [WARNING] reflective value(s) found and filtering out
GET parameter 'id' is vulnerable. Do you want to keep testing the others (if any)? [y/N] N
sqlmap identified the following injection point(s) with a total of 51 HTTP(s) requests:
---
Parameter: id (GET)
    Type: boolean-based blind
    Title: AND boolean-based blind - WHERE or HAVING clause
    Payload: id=1 AND 3205=3205
---
[18:41:38] [INFO] the back-end DBMS is SQLite
back-end DBMS: SQLite
"""
expected = "[INFO] GET parameter 'id' appears to be 'AND boolean-based blind - WHERE or HAVING clause' injectable (with --string=\"alice\")\nGET parameter 'id' is vulnerable.\nsqlmap identified the following injection point(s) with a total of 51 HTTP(s) requests:\n---\nParameter: id (GET)\n    Type: boolean-based blind\n    Title: AND boolean-based blind - WHERE or HAVING clause\n    Payload: id=1 AND 3205=3205\n---\n[INFO] the back-end DBMS is SQLite\nback-end DBMS: SQLite"

[[tests.sqlmap]]
name = "banner and legal disclaimer are dropped"
input = """
        ___
       __H__
 ___ ___[(]_____ ___ ___  {1.10.6#stable}
|_ -| . [.]     | .'| . |
|___|_  ["]_|_|_|__,|  _|
      |_|V...       |_|   https://sqlmap.org

[!] legal disclaimer: Usage of sqlmap for attacking targets without prior mutual consent is illegal.

[*] starting @ 18:41:34 /2026-08-16/
back-end DBMS: SQLite
"""
expected = "back-end DBMS: SQLite"

[[tests.sqlmap]]
name = "a not-injectable verdict is not swallowed"
input = "[18:41:34] [INFO] testing 'Generic inline queries'\n[18:41:38] [WARNING] GET parameter 'id' does not seem to be injectable\n[18:41:38] [CRITICAL] all tested parameters do not appear to be injectable."
expected = "[WARNING] GET parameter 'id' does not seem to be injectable\n[CRITICAL] all tested parameters do not appear to be injectable."

[[tests.sqlmap]]
name = "connection failure is not swallowed"
input = "[18:41:34] [INFO] testing connection to the target URL\n[18:41:34] [CRITICAL] unable to connect to the target URL. sqlmap is going to retry the request(s)"
expected = "[CRITICAL] unable to connect to the target URL. sqlmap is going to retry the request(s)"
