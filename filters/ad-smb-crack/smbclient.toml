[filters.smbclient]
description = "Drop smbclient's constant cosmetic warning banner; keep every listing, error, and NT_STATUS line untouched"
match_command = "^smbclient\\b"
strip_ansi = true
filter_stderr = true
strip_lines_matching = [
  "^WARNING: no network interfaces found$",
]
max_lines = 300
on_empty = "smbclient: nothing survived the filter (see full output)"

[[tests.smbclient]]
name = "recurse listing: warning dropped, every file/dir line kept"
input = """
WARNING: no network interfaces found
  Public                              D       60  Thu Oct 15 16:36:13 2026
  Secret                              D       60  Thu Oct 15 16:36:13 2026

\\Public
  readme.txt                         AN       20  Thu Oct 15 16:36:13 2026

\\Secret
  passwords.txt                      AN        8  Thu Oct 15 16:36:13 2026

\t\t148529400 blocks of size 1024. 14851044 blocks available
"""
expected = "  Public                              D       60  Thu Oct 15 16:36:13 2026\n  Secret                              D       60  Thu Oct 15 16:36:13 2026\n\n\\Public\n  readme.txt                         AN       20  Thu Oct 15 16:36:13 2026\n\n\\Secret\n  passwords.txt                      AN        8  Thu Oct 15 16:36:13 2026\n\n\t\t148529400 blocks of size 1024. 14851044 blocks available"

[[tests.smbclient]]
name = "share-not-found NT_STATUS is not swallowed"
input = "WARNING: no network interfaces found\ntree connect failed: NT_STATUS_OBJECT_PATH_NOT_FOUND"
expected = "tree connect failed: NT_STATUS_OBJECT_PATH_NOT_FOUND"

[[tests.smbclient]]
name = "connection-refused NT_STATUS is not swallowed"
input = "WARNING: no network interfaces found\ndo_connect: Connection to 127.0.0.1 failed (Error NT_STATUS_CONNECTION_REFUSED)"
expected = "do_connect: Connection to 127.0.0.1 failed (Error NT_STATUS_CONNECTION_REFUSED)"
